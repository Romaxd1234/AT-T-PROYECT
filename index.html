<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Inventario de Racks
  </title>
  <style>
   
:root {
    --bg: #f4f5f7;
    --card: #fff;
    --ink: #1c2230;
    --mut: #6b7385;
    --line: #dde1e8;
    --acc: #1f5eff;
    --acc2: #e8eeff;
    --ok: #2e9e5b;
    --warn: #e0a21b;
    --bad: #d6453d;
    --free: #eef0f4;
    --occ: #9db8ff;
    --dbl: #5c86f5;
  }
  @media (prefers-color-scheme:dark) {
    :root {
    --bg: #14171d;
    --card: #1d222b;
    --ink: #e8ebf1;
    --mut: #97a0b3;
    --line: #323946;
    --acc: #6b93ff;
    --acc2: #26304a;
    --free: #262c37;
    --occ: #3c5aa8;
    --dbl: #5273d1;
    }
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 12px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header h1 {
    font-size: 17px;
    margin: 0 8px 0 0;
  }
  nav {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  nav button {
    border: 0;
    background: transparent;
    color: var(--mut);
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    font: inherit;
  }
  nav button.on {
    background: var(--acc2);
    color: var(--acc);
    font-weight: 600;
  }
  .sp {
    flex: 1;
  }
  button.b,label.b {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    font: inherit;
    display: inline-block;
  }
  button.p {
    background: var(--acc);
    border-color: var(--acc);
    color: #fff;
  }
  button:disabled {
    opacity: .5;
    cursor: not-allowed;
  }
  #st {
    font-size: 12px;
    color: var(--mut);
  }
  main {
    padding: 16px;
    max-width: 1500px;
    margin: 0 auto;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  h2 {
    font-size: 15px;
    margin: 0 0 12px;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
  }
  .f {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 150px;
  }
  .f label {
    font-size: 12px;
    color: var(--mut);
  }
  input,select,textarea {
    font: inherit;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
  }
  table {
    border-collapse: collapse;
    width: 100%;
  }
  th,td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  th {
    color: var(--mut);
    font-weight: 600;
    position: sticky;
    top: 0;
    background: var(--card);
  }
  .tw {
    overflow: auto;
    max-height: 60vh;
  }
  .pill {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 99px;
    font-size: 12px;
    color: #fff;
  }
  .VERDE {
    background: var(--ok);
  }
  .AMARILLO {
    background: var(--warn);
  }
  .ROJO {
    background: var(--bad);
  }
  .stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    min-width: 130px;
  }
  .stat b {
    display: block;
    font-size: 20px;
  }
  .stat span {
    font-size: 12px;
    color: var(--mut);
  }
  /* mapa */
  .map {
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    padding: 8px;
  }
  .grid {
    display: grid;
    grid-template-columns: 34px repeat(var(--n),26px);
    gap: 0;
    width: max-content;
  }
  .lv {
    position: sticky;
    left: 0;
    background: var(--card);
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--mut);
  }
  .hd {
    font-size: 10px;
    text-align: center;
    color: var(--mut);
    padding: 2px 0;
  }
  .hd.odd {
    border-left: 2px solid var(--line);
  }
  .c {
    height: 34px;
    border: 1px solid var(--bg);
    background: var(--free);
    font-size: 9px;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    border-bottom: 3px solid transparent;
  }
  .c.odd {
    border-left: 2px solid var(--line);
  }
  .c.o {
    background: var(--occ);
  }
  .c.d {
    background: var(--dbl);
    color: #fff;
  }
  .c.sel {
    outline: 2px solid var(--acc);
    outline-offset: -2px;
    z-index: 1;
  }
  .c.VERDE {
    border-bottom-color: var(--ok);
  }
  .c.AMARILLO {
    border-bottom-color: var(--warn);
  }
  .c.ROJO {
    border-bottom-color: var(--bad);
  }
  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--mut);
    margin: 8px 0;
  }
  .legend i {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: -2px;
  }

  .logo {
    height: 60px;
    width: auto;
    object-fit: contain;
  }
  .msg {
    padding: 8px 12px;
    border-radius: 8px;
    margin: 8px 0;
    font-size: 13px;
  }
  .msg.ok {
    background: #e3f5ea;
    color: #17613a;
  }
  .msg.er {
    background: #fde8e6;
    color: #8a2620;
  }
  .msg.in {
    background: var(--acc2);
    color: var(--acc);
  }
  @media (prefers-color-scheme:dark) {
    .msg.ok {
    background: #17382a;
    color: #8fe0b2;
    }
    .msg.er {
    background: #432220;
    color: #ffb3ad;
    }
  }
  .hide {
    display: none;
  }
  .mut {
    color: var(--mut);
  }

  </style>
 </head>
 <body>
  <header>
    <img src="img/logo.png" alt="Inventario de Racks" class="logo">
   <nav id="nav">
   </nav>
   <span class="sp">
   </span>
   <span id="st">
    Sin archivo abierto
   </span>
   <button class="b" id="bSave">
    Guardar
   </button>
  </header>
  <main id="main">
  </main>

          const ci=XL.colIdx(c.getAttribute('r')),ty=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];
          let val='';
          if(ty==='s'&&v)val=strings[+v.textContent]??'';

    names.forEach((n,i)=>{

/* ===== Guardado que CONSERVA el formato del Excel original ===== */
Object.assign(XL,{
  cellVal(c,strings){
    const ty=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];
    if(ty==='s'&&v)return strings[+v.textContent]??'';
    if(ty==='inlineStr')return [...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
    if(ty==='b'&&v)return v.textContent==='1';
    if(v)return ty==='str'||ty==='e'?v.textContent:(isNaN(+v.textContent)?v.textContent:+v.textContent);
    return '';
  },
  sheetXml(rows){
    const w=Math.max(1,...rows.map(r=>r.length));
    let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="'+w+'" width="20" customWidth="1"/></cols><sheetData>';
    rows.forEach((r,ri)=>{x+=`<row r="${ri+1}">`;r.forEach((v,ci)=>{
      if(v===''||v==null)return;const ref=XL.colName(ci)+(ri+1);
      x+=typeof v==='number'&&isFinite(v)?`<c r="${ref}"><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${XL.esc(v)}</t></is></c>`;
    });x+='</row>'});
    return x+'</sheetData></worksheet>';
  },
  async patch(base,jobs){
    const z=await JSZip.loadAsync(base),P=new DOMParser(),SER=new XMLSerializer();
    const RNS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    const parse=async p=>{const f=z.file(p);return f?P.parseFromString(await f.async('string'),'application/xml'):null};
    const wb=await parse('xl/workbook.xml'),rels=await parse('xl/_rels/workbook.xml.rels'),ct=await parse('[Content_Types].xml'),ss=await parse('xl/sharedStrings.xml');
    const strings=ss?[...ss.getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
    const relMap={};[...rels.getElementsByTagName('Relationship')].forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
    const paths={};
    for(const s of wb.getElementsByTagName('sheet')){
      const rid=s.getAttribute('r:id')||s.getAttributeNS(RNS,'id');
      let t=(relMap[rid]||'').replace(/^\//,'');if(!t.startsWith('xl/'))t='xl/'+t;
      paths[s.getAttribute('name')]=t;
    }
    let dropCalc=false,wbCh=false,relCh=false,ctCh=false;

    for(const job of jobs){
      const {name,cols,recs}=job,meta=job.meta||{};
      const colMap={...(meta.cols||{})};let nc=meta.ncols||0;
      const missing=[];for(const c of cols)if(!(c in colMap)){colMap[c]=nc++;missing.push(c)}
      const used=meta.used||new Set();
      let nxt=Math.max(1,...used,...recs.map(r=>r._row||0))+1;
      for(const r of recs)if(!r._row)r._row=nxt++;

      /* hoja que no existe en el archivo: se crea (solo si tiene datos) */
      if(!paths[name]){
        if(!recs.length)continue;
        const n=1+Math.max(0,...Object.keys(z.files).map(f=>+((/^xl\/worksheets\/sheet(\d+)\.xml$/.exec(f)||[])[1]||0)));
        z.file(`xl/worksheets/sheet${n}.xml`,XL.sheetXml([cols,...recs.map(r=>cols.map(c=>r[c]))]));
        const sid=1+Math.max(0,...[...wb.getElementsByTagName('sheet')].map(s=>+s.getAttribute('sheetId')||0));
        const rid='rIdInv'+n;
        const se=wb.createElementNS(wb.documentElement.namespaceURI,'sheet');
        se.setAttribute('name',name);se.setAttribute('sheetId',sid);se.setAttributeNS(RNS,'r:id',rid);
        wb.getElementsByTagName('sheets')[0].appendChild(se);wbCh=true;
        const re=rels.createElementNS(rels.documentElement.namespaceURI,'Relationship');
        re.setAttribute('Id',rid);re.setAttribute('Type',RNS+'/worksheet');re.setAttribute('Target','worksheets/sheet'+n+'.xml');
        rels.documentElement.appendChild(re);relCh=true;
        const ov=ct.createElementNS(ct.documentElement.namespaceURI,'Override');
        ov.setAttribute('PartName','/xl/worksheets/sheet'+n+'.xml');
        ov.setAttribute('ContentType','application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml');
        ct.documentElement.appendChild(ov);ctCh=true;
        paths[name]='xl/worksheets/sheet'+n+'.xml';
        continue;
      }

      /* hoja existente: se edita en su lugar */
      const path=paths[name],doc=await parse(path),NS=doc.documentElement.namespaceURI;
      const sd=doc.getElementsByTagName('sheetData')[0];
      const rowMap=new Map();for(const r of sd.children)rowMap.set(+r.getAttribute('r'),r);
      const tplRow=Math.max(2,...used);
      const findCell=(row,ci)=>{for(const c of row.children){if(XL.colIdx(c.getAttribute('r'))===ci)return c}return null};
      const getRow=rn=>{
        let row=rowMap.get(rn);if(row)return row;
        row=doc.createElementNS(NS,'row');row.setAttribute('r',rn);
        let before=null,bk=Infinity;for(const [k,el] of rowMap)if(k>rn&&k<bk){bk=k;before=el}
        sd.insertBefore(row,before);rowMap.set(rn,row);return row;
      };
      const styleOf=(rn,ci)=>{
        if(rn===1){let s=null;const row=rowMap.get(1);if(row)for(const c of row.children){if(XL.colIdx(c.getAttribute('r'))<ci&&c.getAttribute('s'))s=c.getAttribute('s')}return s}
        const t=rowMap.get(tplRow),c=t&&findCell(t,ci);return c?c.getAttribute('s'):null;
      };
      const put=(rn,ci,v)=>{
        v=v==null?'':v;
        let row=rowMap.get(rn),cell=row&&findCell(row,ci);
        if(!cell){
          if(v==='')return;
          row=getRow(rn);
          let before=null;for(const c of row.children){if(XL.colIdx(c.getAttribute('r'))>ci){before=c;break}}
          cell=doc.createElementNS(NS,'c');cell.setAttribute('r',XL.colName(ci)+rn);
          const s=styleOf(rn,ci);if(s)cell.setAttribute('s',s);
          row.insertBefore(cell,before);
        }else if(String(XL.cellVal(cell,strings))===String(v))return;   // sin cambios: no se toca
        if(cell.getElementsByTagName('f').length)dropCalc=true;
        while(cell.firstChild)cell.removeChild(cell.firstChild);
        cell.removeAttribute('t');
        if(v==='')return;
        if(typeof v==='number'&&isFinite(v)){
          const ve=doc.createElementNS(NS,'v');ve.textContent=String(v);cell.appendChild(ve);
        }else{
          cell.setAttribute('t','inlineStr');
          const is=doc.createElementNS(NS,'is'),t=doc.createElementNS(NS,'t');
          t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');
          t.textContent=String(v);is.appendChild(t);cell.appendChild(is);
        }
      };

      for(const c of missing)put(1,colMap[c],c);                       // encabezados que faltan

      const live=new Set(recs.map(r=>r._row));

      const reservedRows=new Set(
      meta.emptyRows
          ? [...meta.emptyRows.values()]
          : []
      );

      for(const rn of used){
      if(!live.has(rn) && !reservedRows.has(rn)){
          for(const c of cols){
          put(rn,colMap[c],'');
          }
      }
      }

      for(const r of recs){
        for(const c of cols){
          put(r._row,colMap[c],r[c]);
        }
      }

      let maxR=1,maxC=0;
      for(const [k,row] of rowMap)for(const c of row.children){maxR=Math.max(maxR,k);maxC=Math.max(maxC,XL.colIdx(c.getAttribute('r')))}
      const dim=doc.getElementsByTagName('dimension')[0];
      if(dim)dim.setAttribute('ref','A1:'+XL.colName(maxC)+maxR);
      z.file(path,SER.serializeToString(doc));
    }

    if(dropCalc){
      z.remove('xl/calcChain.xml');
      for(const r of [...rels.getElementsByTagName('Relationship')])if(/calcChain/.test(r.getAttribute('Type')||'')){r.parentNode.removeChild(r);relCh=true}
      for(const o of [...ct.getElementsByTagName('Override')])if(o.getAttribute('PartName')==='/xl/calcChain.xml'){o.parentNode.removeChild(o);ctCh=true}
    }
    if(wbCh)z.file('xl/workbook.xml',SER.serializeToString(wb));
    if(relCh)z.file('xl/_rels/workbook.xml.rels',SER.serializeToString(rels));
    if(ctCh)z.file('[Content_Types].xml',SER.serializeToString(ct));
    return z.generateAsync({type:'uint8array',compression:'DEFLATE'});
  }
});

/* ========== Estado ========== */
const LEVELS=['A','B','C','D','E'];
const TCOLS=[
  'ID',
  'UBICACION',
  'ORACLE',
  'DESCRIPCION',
  'CANTIDAD',
  'SUBINVENTARIO',
  'OWNER',
  'SEMAFORO',
  'LOTE',
  'POSICIONES',
  'FECHA_RECIBO',
  'ESTADO',
  'COMENTARIOS'
];

const BDCOLS=[...TCOLS,'CARA','ALMACEN'];
const PCOLS=['ORACLE','DESCRIPCION','UNIDAD','PZ_POR_TARIMA'];
const MCOLS=['FECHA','TIPO','ID_TARIMA','ORACLE','CANTIDAD','ORIGEN','DESTINO','NOTA'];
let S={cfg:{prefijo:'R01',racks:2,posiciones:92},tarimas:[],productos:[],movs:[]};
let handle=null,fname='',dirty=false,tab='mapa',rackSel=1,selCell=null,warn='';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const now=()=>{const d=new Date(),p=n=>pad(n);return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
const mk=(r,p,l)=>`${S.cfg.prefijo}-${pad(p)}${l}-${pad(r)}`;
function parse(code){const m=/^([A-Z0-9]+)-(\d{1,3})([A-E])-(\d{1,2})$/i.exec(String(code||'').trim());return m?{rack:+m[4],pos:+m[2],lvl:m[3].toUpperCase()}:null}
const isDbl=t=>+t.POSICIONES===2;
const baseOf=(pos,d)=>d&&pos%2===0?pos-1:pos;
function cellsOf(t){const p=parse(t.UBICACION);if(!p)return[];if(!isDbl(t))return[p];const b=baseOf(p.pos,true);return[b,b+1].map(x=>({...p,pos:x}))}

function occMap(ignore){
  const m=new Map();

  for(const t of S.tarimas){

    if(t.ID===ignore)continue;

    // Identificar registros vacíos de tarimas retiradas
    const sinMaterial=
      !String(t.ORACLE||'').trim() &&
      !String(t.DESCRIPCION||'').trim() &&
      !String(t.SUBINVENTARIO||'').trim() &&
      !String(t.LOTE||'').trim();

    const cantidad=Number(t.CANTIDAD)||0;

    // Si está vacía, no debe bloquear la ubicación
    if(sinMaterial && cantidad<=0)continue;

    // Registrar únicamente tarimas ocupadas
    for(const c of cellsOf(t)){
      m.set(`${c.rack}|${c.pos}|${c.lvl}`,t);
    }
  }

  return m;
}

function check(code,dbl,ignore){
  const p=parse(code);if(!p)return{ok:false,msg:'Ubicación inválida. Formato: '+mk(1,3,'C')};
  if(p.rack<1||p.rack>S.cfg.racks)return{ok:false,msg:`Rack ${p.rack} no existe (hay ${S.cfg.racks}).`};
  const b=baseOf(p.pos,dbl),cells=dbl?[b,b+1]:[p.pos];
  if(cells.some(x=>x<1||x>S.cfg.posiciones))return{ok:false,msg:'Posición fuera de rango (1 a '+S.cfg.posiciones+').'};
  const om=occMap(ignore);
  for(const x of cells){const o=om.get(`${p.rack}|${x}|${p.lvl}`);if(o)return{ok:false,msg:`La posición ${pad(x)}${p.lvl} del rack ${pad(p.rack)} ya está ocupada por la tarima del lote ${o.LOTE||'sin lote'} (${o.ORACLE||o.DESCRIPCION||'sin código'}).`}}
  return{ok:true,loc:mk(p.rack,b,p.lvl),pos:cells};
}
function suggest(dbl){
  const om=occMap(),free=(r,p,l)=>p>=1&&p<=S.cfg.posiciones&&!om.has(`${r}|${p}|${l}`);
  for(let pass=0;pass<2;pass++)for(let r=1;r<=S.cfg.racks;r++)for(const l of LEVELS)for(let p=1;p<=S.cfg.posiciones;p++){
    if(dbl){if(p%2===1&&free(r,p,l)&&free(r,p+1,l)&&pass===1)return mk(r,p,l);continue}
    if(!free(r,p,l))continue;
    const partner=p%2===1?p+1:p-1;
    if(pass===0&&om.has(`${r}|${partner}|${l}`)&&!isDbl(om.get(`${r}|${partner}|${l}`)))return mk(r,p,l);
    if(pass===1)return mk(r,p,l);
  }
  return null;
}
function nextId(){
  let m=0;

  for(const t of S.tarimas){
    const n=Number(String(t.ID||'').replace(/\D/g,''));
    if(n>m)m=n;
  }

  return String(m+1);
}
function log(tipo,t,cant,o,d,nota){S.movs.push({FECHA:now(),TIPO:tipo,ID_TARIMA:t.ID,ORACLE:t.ORACLE,CANTIDAD:cant,ORIGEN:o||'',DESTINO:d||'',NOTA:nota||''})}

/* ========== Archivo ========== */
const norm=h=>String(h).normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toUpperCase().replace(/\s+/g,'_');
const ALIAS={
  ITEAM:'ID',
  TARIMA:'ID',
  ORACLE_DESCRIPCION:'DESCRIPCION',
  POSICIONES:'POSICIONES',
  UBICACION:'UBICACION',
  CARA:'CARA',
  ALMACEN:'ALMACEN'
};
let base=null,META={};
function table(rows,cols,meta){
  if(meta){meta.cols={};meta.ncols=0;meta.used=new Set()}
  if(!rows||!rows.length)return[];
  const hdr=(rows[0]||[]).map(h=>{const n=norm(h);return ALIAS[n]||n});
  if(meta){cols.forEach(c=>{const i=hdr.indexOf(c);if(i>=0)meta.cols[c]=i});meta.ncols=hdr.length}
  return rows.map((r,i)=>[r,i]).slice(1).filter(([r])=>r&&r.some(v=>v!==''&&v!=null)).map(([r,i])=>{
    const o={};cols.forEach(c=>{const k=hdr.indexOf(c);o[c]=k>=0&&r[k]!=null?r[k]:''});
    if(meta){o._row=i+1;meta.used.add(i+1)}
    return o;
  });
}
function load(sh){
  const cfg=Object.fromEntries((sh['Config']||[]).slice(1).filter(r=>r[0]).map(r=>[norm(r[0]).toLowerCase(),r[1]]));
  S.cfg={prefijo:String(cfg.prefijo||'R01'),racks:+cfg.racks||2,posiciones:+cfg.posiciones||92};
   const tn=sh['Tarimas']?'Tarimas':(sh['BD']?'BD':'Tarimas');
  META={tar:{name:tn},prod:{name:'Productos'},mov:{name:'Movimientos'}};
  S.tarimas=table(sh[tn],BDCOLS,META.tar);

  // Identificar filas que representan ubicaciones vacías
  META.tar.emptyRows=new Map();

  S.tarimas=S.tarimas.filter(t=>{

    const sinMaterial=
      !String(t.ORACLE||'').trim() &&
      !String(t.DESCRIPCION||'').trim() &&
      !String(t.SUBINVENTARIO||'').trim() &&
      !String(t.LOTE||'').trim();

    const cantidad=Number(t.CANTIDAD)||0;

    // Una ubicación sin material y con cantidad cero está disponible
    if(sinMaterial && cantidad<=0){

      META.tar.emptyRows.set(
        String(t.UBICACION||'').trim(),
        t._row
      );

      // Evitar que XL.patch borre esta fila
      META.tar.used.delete(t._row);

      return false;
    }

    return true;
  });

  S.productos=table(sh['Productos'],PCOLS,META.prod);
  S.movs=table(sh['Movimientos'],MCOLS,META.mov);
  let w=[],seen=new Set(),n=0;
  for(const t of S.tarimas){
    if(!t.ID)t.ID=nextId();
    t.POSICIONES=+t.POSICIONES===2?2:1;t.CANTIDAD=+t.CANTIDAD||0;
    const p=parse(t.UBICACION);
    if(!p){w.push(`${t.ID}: ubicación inválida "${t.UBICACION}"`);continue}
    for(const c of cellsOf(t)){const k=`${c.rack}|${c.pos}|${c.lvl}`;if(seen.has(k)){w.push(`${t.ID}: ubicación repetida ${t.UBICACION}`);break}seen.add(k)}
  }
  warn=w.length?`${w.length} fila(s) con problemas de ubicación: `+w.slice(0,5).join('; ')+(w.length>5?'…':''):'';
}

async function bytes(){

  const ordenadas=[...S.tarimas].sort((a,b)=>{
    const A=parse(a.UBICACION);
    const B=parse(b.UBICACION);

    if(!A&&!B)return 0;
    if(!A)return 1;
    if(!B)return -1;

    return (
      B.rack-A.rack ||
      B.pos-A.pos ||
      B.lvl.localeCompare(A.lvl)
    );
  });

  // Asignar a las tarimas nuevas su fila reservada
  for(const t of ordenadas){

    if(t._row)continue;

    const ubicacion=String(t.UBICACION||'').trim();
    const filaReservada=META.tar.emptyRows?.get(ubicacion);

    if(filaReservada){
      t._row=filaReservada;
      META.tar.emptyRows.delete(ubicacion);
    }
  }

  const config=[
    {CLAVE:'prefijo',VALOR:S.cfg.prefijo,_row:2},
    {CLAVE:'racks',VALOR:S.cfg.racks,_row:3},
    {CLAVE:'posiciones',VALOR:S.cfg.posiciones,_row:4}
  ];

  const metaConfig={
    cols:{CLAVE:0,VALOR:1},

const XLSX_TYPES=[{description:'Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}];
const IDB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('inventario_racks',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(k){const db=await IDB.open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){const db=await IDB.open();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
};
const blankState=()=>({cfg:{prefijo:'R01',racks:2,posiciones:92},tarimas:[],productos:[],movs:[]});

function download(b,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([b],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=name||'inventario.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

async function save(manual){
  if(!fname)return false;
  try{
    const b=await bytes();
    try{await IDB.set('data',{name:fname,bytes:b})}catch(e){}   // respaldo local siempre
    if(handle){
      const w=await handle.createWritable();
      await w.write(b);await w.close();
    }else if(manual===true){
      download(b,fname);
    }
    dirty=false;status();
    return true;
  }catch(e){
    toast('No se pudo guardar en el archivo: '+e.message,'er');
    return false;
  }
}
async function changed(){dirty=true;status();await save();render()}
function status(){$('#st').textContent=(fname?fname:'Sin archivo')+(fname?(dirty?' · ● sin guardar':' · guardado'):'')+(fname&&!handle?' · guardado en este navegador':'')}

async function openBuf(buf,name){
  try{
    load(await XL.read(buf));base=new Uint8Array(buf);fname=name;dirty=false;selCell=null;needPerm=false;
    try{await IDB.set('data',{name:fname,bytes:new Uint8Array(buf)})}catch(e){}
    status();render();toast('Archivo cargado: '+S.tarimas.length+' tarimas.','ok');
  }catch(e){toast('No se pudo leer el Excel: '+e.message,'er')}
}

async function init(){

  if(handle){
    let p='prompt';

function vMapa(){
  const R=rackSel,om=occMap(),N=S.cfg.posiciones;

  const rackUsed=[...om.keys()].filter(k=>k.startsWith(R+'|')).length;
  let h=`<div class="stats"><div class="stat"><b>${S.tarimas.length}</b><span>tarimas</span></div>
  <div class="stat"><b>${used} / ${total}</b><span>posiciones ocupadas (${total?Math.round(used/total*100):0}%)</span></div>
  <div class="stat"><b>${rackUsed} / ${N*LEVELS.length}</b><span>en el rack ${pad(R)}</span></div>
  <div class="stat"><b>${S.tarimas.filter(isDbl).length}</b><span>tarimas dobles</span></div></div>
  <div class="row" style="margin-bottom:8px"><div class="f"><label>Rack</label><select id="rk">${Array.from({length:S.cfg.racks},(_,i)=>`<option value="${i+1}" ${i+1===R?'selected':''}>Rack ${pad(i+1)}</option>`).join('')}</select></div></div>

  <div class="map"><div class="grid" style="--n:${N}"><div></div>`;
  for(let p=1;p<=N;p++)h+=`<div class="hd ${p%2?'odd':''}" style="grid-row:1;grid-column:${p+1}">${pad(p)}</div>`;
    for(const [ri,l] of [...LEVELS].reverse().entries()){
    const row=ri+2;
    h+=`<div class="lv" style="grid-row:${row};grid-column:1">${l}</div>`;
    for(let p=1;p<=N;p++){
      const t=om.get(`${R}|${p}|${l}`),odd=p%2?'odd':'';

        continue;
      }

function aMapa(){
  $('#rk').onchange=e=>{rackSel=+e.target.value;selCell=null;render()};
  document.querySelector('.grid').onclick=e=>{const c=e.target.closest('.c');if(!c)return;selCell={rack:rackSel,pos:+c.dataset.p,lvl:c.dataset.l};render()};
  const g=id=>document.getElementById(id);
  if(g('goRec'))g('goRec').onclick=()=>{recPre=mk(selCell.rack,selCell.pos,selCell.lvl);tab='recibo';render()};
  if(g('doMv'))g('doMv').onclick=()=>{
    const t=occMap().get(`${selCell.rack}|${selCell.pos}|${selCell.lvl}`),to=g('mvTo').value.trim();
    const r=check(to,isDbl(t),t.ID);if(!r.ok){toast(r.msg,'er');return}
    const old=t.UBICACION;t.UBICACION=r.loc;log('REUBICACION',t,t.CANTIDAD,old,r.loc);selCell=parse(r.loc);rackSel=selCell.rack;toast(`Tarima del lote ${t.LOTE||'sin lote'} movida a ${r.loc}.`,'ok');changed();
  };
  if(g('doQ'))g('doQ').onclick=()=>{
    const t=occMap().get(`${selCell.rack}|${selCell.pos}|${selCell.lvl}`),q=+g('newQ').value;
    if(!(q>=0)){toast('Cantidad inválida.','er');return}
    log('AJUSTE',t,q-t.CANTIDAD,t.UBICACION,t.UBICACION,`de ${t.CANTIDAD} a ${q}`);t.CANTIDAD=q;toast('Cantidad ajustada.','ok');changed();
  };

    if(g('doRm'))g('doRm').onclick=()=>{
        const t=occMap().get(`${selCell.rack}|${selCell.pos}|${selCell.lvl}`);

        if(!confirm(`¿Retirar la tarima del lote ${t.LOTE||'sin lote'} de ${t.UBICACION}? Se liberará su ubicación.`))return;

        log('BAJA',t,-t.CANTIDAD,t.UBICACION,'');

        // Conservar los datos de la ubicación
        const conservar=['ID','UBICACION','CARA','ALMACEN','_row'];

        // Vaciar solamente los datos de la tarima
        for(const campo of Object.keys(t)){
            if(!conservar.includes(campo)){
                t[campo]='';
            }
        }

        selCell=null;
        toast('Tarima retirada.','ok');
        changed();
    };

    }

            <div class="c d ${t.SEMAFORO} odd${sel}"
                 style="grid-row:${row};grid-column:${p+1} / span 2"
                 data-p="${p}"
                 data-l="${l}"
                 title="${esc(mk(R,p,l)+' · '+(t.LOTE||'sin lote')+' · '+(t.DESCRIPCION||t.ORACLE)+' · cant '+t.CANTIDAD)}">
              ${esc((t.ORACLE||t.DESCRIPCION||'').slice(0,10))}
            </div>
          `;
        }

        continue;
      }

      const sel=String(surtSelId)===String(t.ID)?' sel':'';

      mapa+=`
        <div class="c o ${t.SEMAFORO} ${odd}${sel}"
             style="${pos}"
             data-p="${p}"
             data-l="${l}"
             title="${esc(mk(R,p,l)+' · '+(t.LOTE||'sin lote')+' · '+(t.DESCRIPCION||t.ORACLE)+' · cant '+t.CANTIDAD)}">
          ${esc((t.ORACLE||'').slice(-4))}
        </div>
      `;
    }
  }

  mapa+=`
      </div>
    </div>
  `;

  let detalle='';

  if(!seleccionada){

    detalle=`
      <div class="card" style="margin-top:12px">
        <h3>Tarima seleccionada</h3>
        <span class="mut">
          Selecciona una tarima ocupada en el mapa o búscala por LPN.
        </span>
      </div>
    `;

  }else{

    detalle=`
      <div class="card" style="margin-top:12px">
        <h3>Tarima seleccionada</h3>

        <p>
          <b>LPN:</b> ${esc(seleccionada.LOTE||'—')}<br>
          <b>Ubicación:</b> ${esc(seleccionada.UBICACION)}<br>
          <b>Oracle:</b> ${esc(seleccionada.ORACLE||'—')}<br>
          <b>Descripción:</b> ${esc(seleccionada.DESCRIPCION||'—')}<br>
          <b>Lote:</b> ${esc(seleccionada.LOTE||'—')}<br>
          <b>Cantidad actual:</b> ${seleccionada.CANTIDAD}<br>
          <b>Subinventario:</b> ${esc(seleccionada.SUBINVENTARIO||'—')}<br>
          <b>Tipo:</b> ${isDbl(seleccionada)?'Tarima doble':'Tarima sencilla'}
        </p>

        <div class="row">
          <div class="f">
            <label>Tipo de surtido</label>
            <select id="sTipoTarima">
              <option value="completa">Retirar tarima completa</option>
              <option value="piezas">Retirar solamente piezas</option>
            </select>
          </div>

          <div class="f" id="surtCantidadBox" style="display:none">
            <label>Cantidad a retirar</label>
            <input id="sCantTarima" type="number" min="1" max="${seleccionada.CANTIDAD}" placeholder="Cantidad">
          </div>

          <button class="b p" id="sConfirmTarima">
            Confirmar surtido
          </button>
        </div>
      </div>
    `;
  }

  return `
    <div class="card">
      <h2>Surtido por tarima</h2>

      <p>Busca una tarima por su LPN o selecciónala directamente en el mapa.</p>

      <div class="row">
        <div class="f">
          <label>Buscar por LPN</label>
          <input id="sLoc" placeholder="Ingresa el LPN de la tarima">
        </div>

        <button class="b p" id="sFindLoc">
          Buscar tarima
        </button>
      </div>

      ${detalle}

      <h3 style="margin-top:20px">Mapa de racks</h3>

      ${mapa}
    </div>

    <div class="card" style="margin-top:16px">
      <h2>Surtido por material (FIFO)</h2>

      ${prodList()}

      <div class="row">
        <div class="f">
          <label>Código Oracle</label>
          <input id="sO" list="dl">
        </div>

        <div class="f">
          <label>Cantidad solicitada</label>
          <input id="sQ" type="number" min="1">
        </div>

        <div class="f">
          <label>Solo subinventario</label>
          <select id="sS">
            <option>DISPONIBLE</option>
            <option value="">Cualquiera</option>
          </select>
        </div>

        <button class="b p" id="sGo">Calcular surtido</button>
      </div>

      <div id="sRes"></div>
    </div>
  `;
}
function aSurtido(){

  const g=id=>document.getElementById(id);

  plan=null;

  // Vaciar tarima conservando su ubicación y fila de Excel
    function vaciarTarima(t){

    const conservar=[
        'ID',
        'UBICACION',
        'CARA',
        'ALMACEN',
        '_row'
    ];

    for(const campo of Object.keys(t)){
        if(!conservar.includes(campo)){
        t[campo]='';
        }
    }

  const ubicacion=parse(t.UBICACION);

  t.ALMACEN='La Joya';

  if(ubicacion){
    t.CARA=ubicacion.rack%2===1
      ?'FRENTE'
      :'ATRAS';
  }
}
  // ------------------------------------
  // MAPA Y SELECCIÓN DE TARIMAS
  // ------------------------------------

  if(g('surtRack')){

    g('surtRack').onchange=e=>{

      surtRackSel=+e.target.value;
      surtSelCell=null;
      surtSelId=null;

      render();
    };
  }

  const grid=document.querySelector('.surt-grid');

  if(grid){

    grid.onclick=e=>{

      const c=e.target.closest('.c');

      if(!c)return;

      const p=+c.dataset.p;
      const l=c.dataset.l;

      surtSelCell={
        rack:surtRackSel,
        pos:p,
        lvl:l
      };

      const t=occMap().get(`${surtRackSel}|${p}|${l}`);

      surtSelId=t?t.ID:null;

      render();
    };
  }

  
  // ------------------------------------
  // BUSCAR TARIMA POR LPN
  // ------------------------------------

  if(g('sFindLoc')){

    g('sFindLoc').onclick=()=>{

      const lpn=g('sLoc').value.trim().toUpperCase();

      if(!lpn){
        toast('Captura el LPN de la tarima.','er');
        return;
      }

      const t=S.tarimas.find(x=>
        String(x.LOTE||'').trim().toUpperCase()===lpn &&
        Number(x.CANTIDAD)>0
      );

      if(!t){
        toast('No se encontró una tarima ocupada con ese LPN.','er');
        return;
      }

      const p=parse(t.UBICACION);

      if(!p){
        toast('La ubicación de la tarima no es válida.','er');
        return;
      }

      surtRackSel=p.rack;
      surtSelCell=p;
      surtSelId=t.ID;

      render();
    };
  }


  // ------------------------------------
  // MOSTRAR CAMPO DE CANTIDAD
  // ------------------------------------

  if(g('sTipoTarima')){

    g('sTipoTarima').onchange=()=>{

      const parcial=g('sTipoTarima').value==='piezas';

      g('surtCantidadBox').style.display=parcial?'block':'none';
    };
  }

  // ------------------------------------
  // CONFIRMAR SURTIDO POR TARIMA
  // ------------------------------------

  if(g('sConfirmTarima')){

    g('sConfirmTarima').onclick=()=>{

      const t=S.tarimas.find(x=>
        String(x.ID)===String(surtSelId)
      );

      if(!t || !(t.CANTIDAD>0)){
        toast('Selecciona una tarima ocupada.','er');
        return;
      }

      const tipo=g('sTipoTarima').value;

      let cantidad=Number(t.CANTIDAD);

      if(tipo==='piezas'){

        cantidad=Number(g('sCantTarima').value);

        if(!Number.isInteger(cantidad) || cantidad<=0){
          toast('Captura una cantidad válida.','er');
          return;
        }

        if(cantidad>t.CANTIDAD){
          toast('La cantidad supera las piezas disponibles en la tarima.','er');
          return;
        }
      }

      const ubicacion=t.UBICACION;

      const mensaje=tipo==='completa'
        ? `¿Confirmas retirar la tarima completa de ${ubicacion}?`
        : `¿Confirmas retirar ${cantidad} piezas de ${ubicacion}?`;

      if(!confirm(mensaje))return;

      log(
        'SURTIDO',
        t,
        -cantidad,
        ubicacion,
        '',
        tipo==='completa'?'Retiro de tarima completa':'Retiro parcial de piezas'
      );

      t.CANTIDAD-=cantidad;

      if(t.CANTIDAD<=0){
        vaciarTarima(t);
        surtSelId=null;
        surtSelCell=null;
      }

      toast(
        tipo==='completa'
          ? 'Tarima retirada. La ubicación quedó disponible.'
          : 'Piezas retiradas. El resto permanece en la misma ubicación.',
        'ok'
      );

      changed();
    };
  }

  // ------------------------------------
  // SURTIDO FIFO ORIGINAL
  // ------------------------------------

  if(g('sGo')){

    g('sGo').onclick=()=>{

      const o=g('sO').value.trim();
      const q=+g('sQ').value;
      const sub=g('sS').value;

      if(!o||!(q>0)){
        toast('Captura código y cantidad.','er');
        return;
      }

      const c=S.tarimas
        .filter(t=>
          String(t.ORACLE).trim()===o &&
          t.CANTIDAD>0 &&
          (!sub||t.SUBINVENTARIO===sub)
        )
        .sort((a,b)=>
          String(a.FECHA_RECIBO||'').localeCompare(String(b.FECHA_RECIBO||'')) ||
          String(a.UBICACION).localeCompare(String(b.UBICACION))
        );

      let rest=q;

      plan=[];

      for(const t of c){

        if(rest<=0)break;

        const take=Math.min(rest,t.CANTIDAD);

        plan.push({t,take});

        rest-=take;
      }

      const avail=c.reduce((s,t)=>s+t.CANTIDAD,0);

      g('sRes').innerHTML=`
        <div class="msg ${rest>0?'er':'in'}">
          Disponible: ${avail}.
          ${rest>0
            ?`Faltan ${rest} pzas para cubrir lo solicitado.`
            :'Se puede cubrir completo.'}
        </div>

        ${plan.length?`
          <div class="tw">
            <table>
              <tr>
                <th>Ubicación</th>
                <th>Lote</th>
                <th>Descripción</th>
                <th>Recibida</th>
                <th>En tarima</th>
                <th>Tomar</th>
                <th>Queda</th>
              </tr>

              ${plan.map(p=>`
                <tr>
                  <td><b>${esc(p.t.UBICACION)}</b></td>
                  <td>${esc(p.t.LOTE||'—')}</td>
                  <td>${esc(p.t.DESCRIPCION)}</td>
                  <td>${esc(p.t.FECHA_RECIBO||'—')}</td>
                  <td>${p.t.CANTIDAD}</td>
                  <td><b>${p.take}</b></td>
                  <td>${p.t.CANTIDAD-p.take}</td>
                </tr>
              `).join('')}

            </table>
          </div>

          <p>
            <button class="b p" id="sOk">
              Confirmar surtido (${q-Math.max(rest,0)} pzas)
            </button>
          </p>
        `:''}
      `;

      // Confirmar surtido FIFO
      if(g('sOk')){

        g('sOk').onclick=()=>{

          if(!plan || !plan.length)return;

          if(!confirm('¿Confirmas el surtido calculado?'))return;

          for(const p of plan){

            log(
              'SURTIDO',
              p.t,
              -p.take,
              p.t.UBICACION,
              ''
            );

            p.t.CANTIDAD-=p.take;

            // Conservar ubicación y fila cuando queda vacía
            if(p.t.CANTIDAD<=0){
              vaciarTarima(p.t);
            }
          }

          plan=null;

          toast(
            'Surtido FIFO registrado. Las ubicaciones vacías quedaron disponibles.',
            'ok'
          );

          changed();
        };
      }
    };
  }
}
/* --- Inventario --- */
function vInv(){
  const by={};S.tarimas.forEach(t=>{const k=t.ORACLE||t.DESCRIPCION||'(sin código)';by[k]=by[k]||{d:t.DESCRIPCION,n:0,q:0};by[k].n++;by[k].q+=t.CANTIDAD});
  return `<div class="card"><h2>Resumen por código</h2><div class="tw" style="max-height:30vh"><table><tr><th>Oracle</th><th>Descripción</th><th>Tarimas</th><th>Cantidad total</th></tr>${Object.entries(by).sort().map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v.d)}</td><td>${v.n}</td><td>${v.q}</td></tr>`).join('')||'<tr><td colspan=4 class="mut">Sin tarimas.</td></tr>'}</table></div></div>
  <div class="card"><h2>Detalle por tarima</h2><div class="row" style="margin-bottom:8px"><div class="f"><label>Buscar</label><input id="q" placeholder="ubicación, código, descripción…"></div></div><div class="tw"><table id="tb"></table></div></div>`;
}
function aInv(){
  const f=()=>{const q=$('#q').value.toLowerCase();
    const rows=S.tarimas.filter(t=>!q||[t.UBICACION,t.ORACLE,t.DESCRIPCION,t.ID,t.OWNER,t.LOTE].join(' ').toLowerCase().includes(q)).sort((a,b)=>String(a.UBICACION).localeCompare(String(b.UBICACION)));
    $('#tb').innerHTML=`<tr><th>Ubicación</th><th>Lote</th><th>Oracle</th><th>Descripción</th><th>Cant.</th><th>Subinv.</th><th>Owner</th><th>Semáforo</th><th>Tipo</th></tr>`+rows.slice(0,500).map(t=>`<tr><td><b>${esc(t.UBICACION)}</b></td><td>${esc(t.LOTE||'—')}</td><td>${esc(t.ORACLE)}</td><td>${esc(t.DESCRIPCION)}</td><td>${t.CANTIDAD}</td><td>${esc(t.SUBINVENTARIO)}</td><td>${esc(t.OWNER)}</td><td>${t.SEMAFORO?`<span class="pill ${t.SEMAFORO}">${t.SEMAFORO}</span>`:''}</td><td>${isDbl(t)?'Doble':'Simple'}</td></tr>`).join('')+(rows.length>500?`<tr><td colspan=9 class="mut">Mostrando 500 de ${rows.length}. Afina la búsqueda.</td></tr>`:'');};
  $('#q').oninput=f;f();
}

/* --- Catálogo --- */
function vCat(){
  return `<div class="card"><h2>Catálogo de productos</h2><div class="row"><div class="f"><label>Código Oracle</label><input id="cO"></div><div class="f" style="min-width:280px"><label>Descripción</label><input id="cD"></div><div class="f"><label>Unidad</label><input id="cU" value="PZA" style="width:90px"></div><div class="f"><label>Pzas por tarima</label><input id="cP" type="number" min="0" style="width:120px"></div><button class="b p" id="cAdd" ${fname?'':'disabled'}>Agregar</button></div></div>
  <div class="card"><div class="tw"><table><tr><th>Oracle</th><th>Descripción</th><th>Unidad</th><th>Pzas/tarima</th></tr>${S.productos.map(p=>`<tr><td>${esc(p.ORACLE)}</td><td>${esc(p.DESCRIPCION)}</td><td>${esc(p.UNIDAD)}</td><td>${esc(p.PZ_POR_TARIMA)}</td></tr>`).join('')||'<tr><td colspan=4 class="mut">Catálogo vacío.</td></tr>'}</table></div></div>`;
}
function aCat(){
  $('#cAdd').onclick=()=>{const o=$('#cO').value.trim();if(!o){toast('Falta el código Oracle.','er');return}
    if(S.productos.some(p=>String(p.ORACLE)===o)){toast('Ese código ya existe.','er');return}
    S.productos.push({ORACLE:o,DESCRIPCION:$('#cD').value.trim(),UNIDAD:$('#cU').value.trim(),PZ_POR_TARIMA:+$('#cP').value||''});toast('Producto agregado.','ok');changed()};
}
